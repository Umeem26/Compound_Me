name: compound_me
description: Personal finance and habit tracker that shows what small habits really cost.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.35.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  phosphor_flutter: ^2.1.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/app_icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "#00695C"
  adaptive_icon_foreground: "assets/brand/adaptive_foreground.png"
  # The mark already carries its own safe-zone padding; the default 16% inset shrinks it.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/brand/adaptive_monochrome.png"

flutter_native_splash:
  color: "#00695C"
  color_dark: "#0C1211"
  image: "assets/brand/splash_mark_1152.png"
  android_12:
    color: "#00695C"
    color_dark: "#0C1211"
    image: "assets/brand/splash_mark_1152.png"
  fullscreen: false
  web: false
